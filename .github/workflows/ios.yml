name: Build iOS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Simulator
        run: xcodebuild -project YoutubeViewer.xcodeproj -scheme YoutubeViewer -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: cd build/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/YoutubeViewer-Simulator.zip" YoutubeViewer.app
      - uses: actions/upload-artifact@v4
        with:
          name: YoutubeViewer-Simulator
          path: YoutubeViewer-Simulator.zip
